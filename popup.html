<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PhishEye</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="header">
        <img src="icons/icon48.png" alt="PhishEye logo" class="logo">
        <h1>PhishEye</h1>
    </header>

    <section class="status">
        <p class="hostname" id="hostname">Loading...</p>
        <p class="verdict neutral" id="verdict">Checking this page...</p>
        <ul class="findings-list" id="findingsList"></ul>
        <button class="trust-btn" id="trustBtn" hidden></button>
    </section>

    <section class="placeholder">
        <h2>Settings</h2>
        <p class="coming-soon">Coming soon</p>
    </section>

    <section class="placeholder">
        <h2>Report</h2>
        <p class="coming-soon">Coming soon</p>
    </section>

    <script src="popup.js"></script>
</body>
</html>
